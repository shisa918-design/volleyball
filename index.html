<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バレーボール対戦表</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        .score-input::-webkit-inner-spin-button,
        .score-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .score-input {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
                    <i data-lucide="trophy" class="w-6 h-6 text-yellow-300"></i>
                    バレーボール対戦表
                </h1>
                <p class="text-xs text-blue-100 mt-0.5">大会用・リアルタイム管理システム</p>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="share-btn" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-3 py-2 rounded-lg flex items-center gap-1 transition shadow-sm">
                    <i data-lucide="share-2" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">共有</span>
                </button>
                
                <button id="admin-toggle-btn" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-2 rounded-lg flex items-center gap-1 transition">
                    <i id="admin-icon" data-lucide="lock" class="w-4 h-4"></i>
                    <span id="admin-label">閲覧モード</span>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- Banner -->
        <div id="mode-banner" class="bg-slate-200 border-l-4 border-slate-500 text-slate-700 p-3 rounded text-sm flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="eye" class="w-5 h-5 text-slate-600"></i>
                <span>現在は<strong>閲覧専用モード</strong>です。</span>
            </div>
        </div>

        <!-- Controls -->
        <div id="controls-section" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 opacity-60 pointer-events-none transition-all">
            <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2 border-b pb-2">
                <i data-lucide="settings" class="w-5 h-5 text-blue-600"></i> 大会設定
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">チーム数 (2〜10)</label>
                    <select id="team-count" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5">
                        <option value="2">2チーム</option>
                        <option value="3">3チーム</option>
                        <option value="4">4チーム</option>
                        <option value="5">5チーム</option>
                        <option value="6" selected>6チーム</option>
                        <option value="7">7チーム</option>
                        <option value="8">8チーム</option>
                        <option value="9">9チーム</option>
                        <option value="10">10チーム</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">使用コート数 (1〜4)</label>
                    <select id="court-count" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5">
                        <option value="1">1コート</option>
                        <option value="2" selected>2コート</option>
                        <option value="3">3コート</option>
                        <option value="4">4コート</option>
                    </select>
                </div>

                <div id="referee-setting-card" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">審判設定</label>
                    <label class="inline-flex items-center cursor-pointer mt-1">
                        <input type="checkbox" id="referee-toggle" class="sr-only peer" checked>
                        <div class="relative w-11 h-6 bg-slate-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                        <span class="ms-3 text-sm font-medium text-slate-700">審判の自動割り当て</span>
                    </label>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-slate-100">
                <label class="block text-xs font-semibold text-slate-600 mb-2">チーム名設定</label>
                <div id="team-names-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2"></div>
            </div>

            <div class="mt-4 flex justify-end">
                <button id="reset-btn" class="bg-red-500 hover:bg-red-600 text-white text-xs px-4 py-2 rounded-lg transition flex items-center gap-1 shadow-sm">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> スコアリセット
                </button>
            </div>
        </div>

        <!-- Matches Section -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2 border-b pb-2">
                <i data-lucide="calendar" class="w-5 h-5 text-blue-600"></i> 対戦表・試合進行
            </h2>
            <div id="matches-container" class="space-y-6"></div>
        </div>

        <!-- Excel-style Cross Matrix Table -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2 border-b pb-2">
                <i data-lucide="grid" class="w-5 h-5 text-green-600"></i> 総当たり星取表（対戦結果マトリクス）
            </h2>
            <div class="overflow-x-auto">
                <table class="min-w-full border-collapse text-xs sm:text-sm text-center">
                    <thead id="matrix-thead" class="bg-slate-100 text-slate-700"></thead>
                    <tbody id="matrix-tbody" class="divide-y divide-slate-200"></tbody>
                </table>
            </div>
        </div>

        <!-- Ranking Section -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2 border-b pb-2">
                <i data-lucide="award" class="w-5 h-5 text-yellow-500"></i> 順位表（リアルタイム集計）
            </h2>
            <div class="overflow-x-auto">
                <table class="min-w-[500px] w-full text-xs sm:text-sm text-left text-slate-600">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-100">
                        <tr>
                            <th class="px-3 py-2.5 text-center whitespace-nowrap min-w-[50px]">順位</th>
                            <th class="px-3 py-2.5 whitespace-nowrap min-w-[100px]">チーム名</th>
                            <th class="px-3 py-2.5 text-center whitespace-nowrap">試合数</th>
                            <th class="px-3 py-2.5 text-center whitespace-nowrap">勝ち</th>
                            <th class="px-3 py-2.5 text-center whitespace-nowrap">負け</th>
                            <th class="px-3 py-2.5 text-center whitespace-nowrap">得点</th>
                            <th class="px-3 py-2.5 text-center whitespace-nowrap">失点</th>
                            <th class="px-3 py-2.5 text-center whitespace-nowrap">得失差</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-tbody" class="divide-y divide-slate-200"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-md font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="shield-lock" class="w-5 h-5 text-blue-600"></i> 管理者認証
                </h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <p class="text-xs text-slate-600">管理モードに入るためのパスコードを入力してください。</p>
            <div>
                <div class="relative">
                    <input type="password" id="admin-passcode" placeholder="パスコード" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm pr-10 focus:ring-blue-500 focus:border-blue-500">
                    <button type="button" id="toggle-passcode-visibility" class="absolute right-2 top-2.5 text-slate-400 hover:text-slate-600">
                        <i id="passcode-eye-icon" data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                </div>
                <p id="login-error" class="text-xs text-red-500 mt-1 hidden">パスコードが正しくありません。</p>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="cancel-login-btn" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">キャンセル</button>
                <button id="submit-login-btn" class="px-4 py-2 text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-lg">ログイン</button>
            </div>
        </div>
    </div>

    <script>
        // 🛠️ Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCZxcKKCxPi4FMzy7P20mdljP4BF_s8-po",
            authDomain: "volleyball-b2c69.firebaseapp.com",
            projectId: "volleyball-b2c69",
            storageBucket: "volleyball-b2c69.firebasestorage.app",
            messagingSenderId: "929403303920",
            appId: "1:929403303920:web:a55aca4b7fcd507e7b0f35"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let state = {
            isAdmin: false,
            teamCount: 6,
            courtCount: 2,
            useReferee: true,
            teamNames: ["チーム1", "チーム2", "チーム3", "チーム4", "チーム5", "チーム6"],
            scores: {}
        };

        const ADMIN_PASSCODE = "0511";
        const docRef = db.collection('tournaments').doc('default_tournament');

        document.addEventListener("DOMContentLoaded", () => {
            initUI();
            listenToRealtimeData();
            lucide.createIcons();
        });

        function listenToRealtimeData() {
            docRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    state.teamCount = data.teamCount || 6;
                    state.courtCount = data.courtCount || 2;
                    state.useReferee = data.useReferee !== undefined ? data.useReferee : true;
                    state.teamNames = data.teamNames || ["チーム1", "チーム2", "チーム3", "チーム4", "チーム5", "チーム6"];
                    state.scores = data.scores || {};
                    renderApp();
                } else {
                    saveToFirestore();
                }
            });
        }

        function saveToFirestore() {
            docRef.set({
                teamCount: state.teamCount,
                courtCount: state.courtCount,
                useReferee: state.useReferee,
                teamNames: state.teamNames,
                scores: state.scores
            }, { merge: true });
        }

        function initUI() {
            document.getElementById('admin-toggle-btn').addEventListener('click', () => {
                if (state.isAdmin) {
                    state.isAdmin = false;
                    updateAdminUI();
                } else {
                    document.getElementById('login-modal').classList.remove('hidden');
                    document.getElementById('admin-passcode').value = '';
                    document.getElementById('login-error').classList.add('hidden');
                    document.getElementById('admin-passcode').focus();
                }
            });

            document.getElementById('close-modal-btn').addEventListener('click', () => {
                document.getElementById('login-modal').classList.add('hidden');
            });
            document.getElementById('cancel-login-btn').addEventListener('click', () => {
                document.getElementById('login-modal').classList.add('hidden');
            });

            document.getElementById('submit-login-btn').addEventListener('click', performLogin);
            document.getElementById('admin-passcode').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') performLogin();
            });

            document.getElementById('toggle-passcode-visibility').addEventListener('click', () => {
                const passInput = document.getElementById('admin-passcode');
                const eyeIcon = document.getElementById('passcode-eye-icon');
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    eyeIcon.setAttribute('data-lucide', 'eye-off');
                } else {
                    passInput.type = 'password';
                    eyeIcon.setAttribute('data-lucide', 'eye');
                }
                lucide.createIcons();
            });

            document.getElementById('share-btn').addEventListener('click', () => {
                const url = window.location.origin + window.location.pathname;
                navigator.clipboard.writeText(url);
                alert('共有用URLをコピーしました！LINE等で全員に共有できます。');
            });

            document.getElementById('team-count').addEventListener('change', (e) => {
                const val = parseInt(e.target.value);
                state.teamCount = val;
                if (state.teamNames.length < val) {
                    for (let i = state.teamNames.length; i < val; i++) {
                        state.teamNames.push(`チーム${i+1}`);
                    }
                } else if (state.teamNames.length > val) {
                    state.teamNames = state.teamNames.slice(0, val);
                }
                if (state.isAdmin) saveToFirestore();
            });

            document.getElementById('court-count').addEventListener('change', (e) => {
                state.courtCount = parseInt(e.target.value);
                if (state.isAdmin) saveToFirestore();
            });

            document.getElementById('referee-toggle').addEventListener('change', (e) => {
                state.useReferee = e.target.checked;
                if (state.isAdmin) saveToFirestore();
            });

            document.getElementById('reset-btn').addEventListener('click', () => {
                if (confirm('すべてのスコアをリセットしてもよろしいですか？')) {
                    state.scores = {};
                    if (state.isAdmin) saveToFirestore();
                }
            });
        }

        function performLogin() {
            const pass = document.getElementById('admin-passcode').value;
            if (pass === ADMIN_PASSCODE) {
                state.isAdmin = true;
                document.getElementById('login-modal').classList.add('hidden');
                updateAdminUI();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function updateAdminUI() {
            const banner = document.getElementById('mode-banner');
            const controls = document.getElementById('controls-section');
            const adminLabel = document.getElementById('admin-label');
            const adminIcon = document.getElementById('admin-icon');
            const refCard = document.getElementById('referee-setting-card');

            if (state.isAdmin) {
                banner.className = "bg-green-100 border-l-4 border-green-500 text-green-700 p-3 rounded text-sm flex items-center justify-between";
                banner.innerHTML = `<div class="flex items-center gap-2"><i data-lucide="shield-check" class="w-5 h-5 text-green-600"></i><span><strong>管理者モード</strong>でログイン中。リアルタイム同期されます。</span></div>`;
                controls.classList.remove('opacity-60', 'pointer-events-none');
                refCard.classList.remove('hidden');
                adminLabel.textContent = "管理者";
                adminIcon.setAttribute('data-lucide', 'unlock');
            } else {
                banner.className = "bg-slate-200 border-l-4 border-slate-500 text-slate-700 p-3 rounded text-sm flex items-center justify-between";
                banner.innerHTML = `<div class="flex items-center gap-2"><i data-lucide="eye" class="w-5 h-5 text-slate-600"></i><span>現在は<strong>閲覧専用モード</strong>です。</span></div>`;
                controls.classList.add('opacity-60', 'pointer-events-none');
                refCard.classList.add('hidden');
                adminLabel.textContent = "閲覧モード";
                adminIcon.setAttribute('data-lucide', 'lock');
            }
            lucide.createIcons();
            renderApp();
        }

        function renderApp() {
            document.getElementById('team-count').value = state.teamCount;
            document.getElementById('court-count').value = state.courtCount;
            document.getElementById('referee-toggle').checked = state.useReferee;

            const nameContainer = document.getElementById('team-names-container');
            nameContainer.innerHTML = '';
            for (let i = 0; i < state.teamCount; i++) {
                const div = document.createElement('div');
                div.innerHTML = `
                    <input type="text" data-index="${i}" value="${state.teamNames[i] || `チーム${i+1}`}" 
                        class="team-name-input w-full bg-slate-50 border border-slate-300 text-xs rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500" 
                        placeholder="チーム${i+1}" ${!state.isAdmin ? 'disabled' : ''}>
                `;
                nameContainer.appendChild(div);
            }

            document.querySelectorAll('.team-name-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'));
                    state.teamNames[idx] = e.target.value.trim() || `チーム${idx+1}`;
                    if (state.isAdmin) saveToFirestore();
                });
            });

            const schedule = generateSchedule(state.teamCount, state.courtCount);
            renderMatches(schedule);
            renderMatrix();
            renderRankings(schedule);

            lucide.createIcons();
        }

        function generateSchedule(n, courtCount) {
            let teams = Array.from({length: n}, (_, i) => i);
            if (n % 2 !== 0) teams.push(-1);

            let numTeams = teams.length;
            let roundsCount = numTeams - 1;
            let rawPairs = [];
            let tempTeams = [...teams];

            for (let r = 0; r < roundsCount; r++) {
                for (let i = 0; i < numTeams / 2; i++) {
                    let t1 = tempTeams[i];
                    let t2 = tempTeams[numTeams - 1 - i];
                    if (t1 !== -1 && t2 !== -1) rawPairs.push({ t1, t2 });
                }
                tempTeams.splice(1, 0, tempTeams.pop());
            }

            let matches = [];
            let currentSlot = [];

            rawPairs.forEach(pair => {
                currentSlot.push(pair);
                if (currentSlot.length === courtCount) {
                    matches.push(currentSlot);
                    currentSlot = [];
                }
            });
            if (currentSlot.length > 0) matches.push(currentSlot);

            return matches.map((slot, matchIdx) => {
                let playingTeams = new Set();
                slot.forEach(p => {
                    playingTeams.add(p.t1);
                    playingTeams.add(p.t2);
                });

                let availableRefs = [];
                for (let i = 0; i < n; i++) {
                    if (!playingTeams.has(i)) availableRefs.push(i);
                }

                let games = slot.map((pair, courtIdx) => {
                    let refTeam = (state.useReferee && availableRefs.length > courtIdx) ? availableRefs[courtIdx] : null;
                    return {
                        id: `m_${matchIdx}_${courtIdx}`,
                        court: courtIdx + 1,
                        t1: pair.t1,
                        t2: pair.t2,
                        ref: refTeam
                    };
                });

                return { matchNum: matchIdx + 1, games: games };
            });
        }

        function renderMatches(schedule) {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            schedule.forEach(matchBlock => {
                const blockDiv = document.createElement('div');
                blockDiv.className = "border border-slate-200 rounded-lg p-4 bg-slate-50/50";
                
                let gamesHtml = matchBlock.games.map(g => {
                    const scoreData = state.scores[g.id] || { score1: '', score2: '' };
                    const t1Name = state.teamNames[g.t1];
                    const t2Name = state.teamNames[g.t2];
                    const refName = g.ref !== null ? state.teamNames[g.ref] : null;

                    return `
                        <div class="bg-white border border-slate-200 rounded-lg p-3 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
                            <div class="flex items-center gap-2">
                                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded whitespace-nowrap">第${g.court}コート</span>
                                ${refName ? `<span class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded border border-slate-200 whitespace-nowrap">審判: ${refName}</span>` : ''}
                            </div>
                            
                            <div class="flex items-center justify-center gap-2 flex-1">
                                <span class="font-semibold text-slate-800 text-xs sm:text-sm text-right flex-1 truncate">${t1Name}</span>
                                <div class="flex items-center gap-1 shrink-0">
                                    <input type="number" min="0" value="${scoreData.score1}" data-matchid="${g.id}" data-side="score1"
                                        class="score-input w-11 h-9 text-center font-bold text-base border border-slate-300 rounded bg-white"
                                        ${!state.isAdmin ? 'disabled' : ''}>
                                    <span class="text-slate-400 font-bold">-</span>
                                    <input type="number" min="0" value="${scoreData.score2}" data-matchid="${g.id}" data-side="score2"
                                        class="score-input w-11 h-9 text-center font-bold text-base border border-slate-300 rounded bg-white"
                                        ${!state.isAdmin ? 'disabled' : ''}>
                                </div>
                                <span class="font-semibold text-slate-800 text-xs sm:text-sm text-left flex-1 truncate">${t2Name}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                blockDiv.innerHTML = `
                    <h3 class="font-bold text-slate-700 text-xs sm:text-sm mb-3 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                        第${matchBlock.matchNum}試合
                    </h3>
                    <div class="space-y-2">
                        ${gamesHtml}
                    </div>
                `;

                container.appendChild(blockDiv);
            });

            document.querySelectorAll('.score-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const matchId = e.target.getAttribute('data-matchid');
                    const side = e.target.getAttribute('data-side');
                    const val = e.target.value;

                    if (!state.scores[matchId]) {
                        state.scores[matchId] = { score1: '', score2: '' };
                    }
                    state.scores[matchId][side] = val;
                    if (state.isAdmin) saveToFirestore();
                });
            });
        }

        // Excel-style Matrix Generation
        function renderMatrix() {
            const thead = document.getElementById('matrix-thead');
            const tbody = document.getElementById('matrix-tbody');
            const n = state.teamCount;

            let headerHtml = `<tr><th class="p-2 border border-slate-200 bg-slate-200 min-w-[80px]">チーム</th>`;
            for (let i = 0; i < n; i++) {
                headerHtml += `<th class="p-2 border border-slate-200 min-w-[65px] font-semibold">${state.teamNames[i]}</th>`;
            }
            headerHtml += `</tr>`;
            thead.innerHTML = headerHtml;

            // Map match score by team index pairs
            let matchResults = {};
            const schedule = generateSchedule(n, state.courtCount);
            schedule.forEach(block => {
                block.games.forEach(g => {
                    const sc = state.scores[g.id];
                    if (sc && sc.score1 !== '' && sc.score2 !== '') {
                        const s1 = parseInt(sc.score1) || 0;
                        const s2 = parseInt(sc.score2) || 0;
                        matchResults[`${g.t1}_${g.t2}`] = { s1, s2 };
                        matchResults[`${g.t2}_${g.t1}`] = { s1: s2, s2: s1 };
                    }
                });
            });

            let bodyHtml = '';
            for (let i = 0; i < n; i++) {
                bodyHtml += `<tr><td class="p-2 border border-slate-200 bg-slate-100 font-bold whitespace-nowrap">${state.teamNames[i]}</td>`;
                for (let j = 0; j < n; j++) {
                    if (i === j) {
                        bodyHtml += `<td class="p-2 border border-slate-200 bg-slate-300 text-slate-500 font-bold">✕</td>`;
                    } else {
                        const res = matchResults[`${i}_${j}`];
                        if (res) {
                            const win = res.s1 > res.s2;
                            const draw = res.s1 === res.s2;
                            const mark = win ? '○' : draw ? '△' : '●';
                            const badgeColor = win ? 'text-blue-600 font-bold' : draw ? 'text-slate-600' : 'text-red-500';
                            bodyHtml += `<td class="p-2 border border-slate-200 bg-white">
                                <div class="${badgeColor}">${mark} ${res.s1} - ${res.s2}</div>
                            </td>`;
                        } else {
                            bodyHtml += `<td class="p-2 border border-slate-200 bg-white text-slate-400">-</td>`;
                        }
                    }
                }
                bodyHtml += `</tr>`;
            }
            tbody.innerHTML = bodyHtml;
        }

        function renderRankings(schedule) {
            let stats = Array.from({ length: state.teamCount }, (_, i) => ({
                id: i,
                name: state.teamNames[i],
                played: 0,
                wins: 0,
                losses: 0,
                ptsFor: 0,
                ptsAgainst: 0,
                diff: 0
            }));

            schedule.forEach(block => {
                block.games.forEach(g => {
                    const sc = state.scores[g.id];
                    if (sc && sc.score1 !== '' && sc.score2 !== '') {
                        const s1 = parseInt(sc.score1) || 0;
                        const s2 = parseInt(sc.score2) || 0;

                        if (g.t1 < state.teamCount && g.t2 < state.teamCount) {
                            stats[g.t1].played++;
                            stats[g.t2].played++;

                            stats[g.t1].ptsFor += s1;
                            stats[g.t1].ptsAgainst += s2;
                            stats[g.t2].ptsFor += s2;
                            stats[g.t2].ptsAgainst += s1;

                            if (s1 > s2) {
                                stats[g.t1].wins++;
                                stats[g.t2].losses++;
                            } else if (s2 > s1) {
                                stats[g.t2].wins++;
                                stats[g.t1].losses++;
                            }
                        }
                    }
                });
            });

            stats.forEach(st => st.diff = st.ptsFor - st.ptsAgainst);

            stats.sort((a, b) => {
                if (b.wins !== a.wins) return b.wins - a.wins;
                if (b.diff !== a.diff) return b.diff - a.diff;
                if (b.ptsFor !== a.ptsFor) return b.ptsFor - a.ptsFor;
                return a.ptsAgainst - b.ptsAgainst;
            });

            const tbody = document.getElementById('ranking-tbody');
            tbody.innerHTML = '';

            stats.forEach((st, rank) => {
                const tr = document.createElement('tr');
                tr.className = rank % 2 === 0 ? 'bg-white' : 'bg-slate-50/50';
                
                let rankBadge = `<span class="font-bold text-slate-700">${rank + 1}</span>`;
                if (rank === 0) rankBadge = `<span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-0.5 rounded-full">1位</span>`;
                else if (rank === 1) rankBadge = `<span class="bg-slate-200 text-slate-800 text-xs font-bold px-2 py-0.5 rounded-full">2位</span>`;
                else if (rank === 2) rankBadge = `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-0.5 rounded-full">3位</span>`;

                tr.innerHTML = `
                    <td class="px-3 py-2.5 text-center whitespace-nowrap">${rankBadge}</td>
                    <td class="px-3 py-2.5 font-semibold text-slate-800 whitespace-nowrap">${st.name}</td>
                    <td class="px-3 py-2.5 text-center whitespace-nowrap">${st.played}</td>
                    <td class="px-3 py-2.5 text-center text-blue-600 font-bold whitespace-nowrap">${st.wins}</td>
                    <td class="px-3 py-2.5 text-center text-red-500 whitespace-nowrap">${st.losses}</td>
                    <td class="px-3 py-2.5 text-center whitespace-nowrap">${st.ptsFor}</td>
                    <td class="px-3 py-2.5 text-center whitespace-nowrap">${st.ptsAgainst}</td>
                    <td class="px-3 py-2.5 text-center font-bold whitespace-nowrap ${st.diff > 0 ? 'text-green-600' : st.diff < 0 ? 'text-red-500' : 'text-slate-600'}">${st.diff > 0 ? '+' + st.diff : st.diff}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
